<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crie uma conta para acessar os arquivos." />
    <title>Criar conta | Gerenciador de arquivos</title>
    <link rel="stylesheet" href="../styles/home.css" />
  </head>
  <body>
    <header class="site-header">
      <a
        class="brand"
        href="login.html"
        aria-label="Página inicial do gerenciador de arquivos"
      >
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Gerenciador de arquivos</span>
      </a>
    </header>

    <main>
      <section class="account-card login-card" aria-labelledby="register-title">
        <span class="eyebrow">NOVA CONTA</span>
        <h1 id="register-title">Criar conta</h1>
        <p class="account-intro">Preencha seus dados para começar.</p>

        <form class="account-form" id="register-form">
          <div class="form-field">
            <label for="register-name">Nome</label>
            <input
              id="register-name"
              name="name"
              type="text"
              autocomplete="name"
              required
            />
          </div>
          <div class="form-field">
            <label for="register-category">Categoria</label>
            <input
              id="register-category"
              name="category"
              type="text"
              autocomplete="organization-title"
              required
            />
          </div>
          <div class="form-field">
            <label for="register-email">E-mail</label>
            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-field">
            <label for="register-password">Senha</label>
            <input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="form-actions">
            <button type="submit">Criar conta</button>
            <p id="register-status" role="status" aria-live="polite"></p>
          </div>
        </form>

        <p class="form-link">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>
    <script src="../../src/modules/register.js" defer></script>
  </body>
</html>

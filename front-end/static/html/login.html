<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre na sua conta para acessar os arquivos." />
    <title>Entrar | Gerenciador de arquivos</title>
    <link rel="stylesheet" href="../styles/home.css" />
  </head>
  <body>
    <header class="site-header">
      <a
        class="brand"
        href="login.html"
        aria-label="Página inicial do gerenciador de arquivos"
      >
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Gerenciador de arquivos</span>
      </a>
    </header>

    <main>
      <section class="account-card login-card" aria-labelledby="login-title">
        <span class="eyebrow">BEM-VINDO DE VOLTA</span>
        <h1 id="login-title">Entrar na sua conta</h1>
        <p class="account-intro">Entre para acessar os arquivos da sua categoria.</p>

        <form class="account-form" id="login-form">
          <div class="form-field">
            <label for="login-email">E-mail</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-field">
            <label for="login-password">Senha</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-actions">
            <button type="submit">Entrar</button>
            <p id="login-status" role="status" aria-live="polite"></p>
          </div>
        </form>
        <p class="form-link">
          Ainda não tem uma conta? <a href="register.html">Criar conta</a>
        </p>
      </section>
    </main>
    <script src="../../src/modules/login.js" defer></script>
  </body>
</html>

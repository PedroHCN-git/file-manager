<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Um espaço simples e organizado para seus arquivos e sua conta."
    />
    <title>Gerenciador de arquivos</title>
    <link rel="stylesheet" href="../styles/home.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html#files" aria-label="Página inicial do gerenciador de arquivos">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Gerenciador de arquivos</span>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="settings.html">Configurações</a>
        <a href="account.html">Conta</a>
        <a class="nav-link-active" href="index.html#files" aria-current="page">Arquivos</a>
        <button class="nav-logout" id="logout-button" type="button">Sair</button>
      </nav>
    </header>

    <main>
      <section class="welcome-card" id="files" aria-labelledby="welcome-title">
        <span class="eyebrow">SEU ESPAÇO PESSOAL</span>
        <h1 id="welcome-title">Seus arquivos em um só lugar.</h1>
        <p>Um espaço simples para manter tudo organizado.</p>
        <div class="search-field">
          <label for="document-search">Buscar arquivo pelo nome</label>
          <input
            id="document-search"
            type="search"
            placeholder="Digite o nome do arquivo"
            autocomplete="off"
          />
        </div>
        <form id="upload-form" class="upload-form">
          <label class="upload-picker" for="document-file">
            <span class="upload-picker-icon" aria-hidden="true">+</span>
            <span id="selected-file-name">Escolher arquivos</span>
          </label>
          <input
            id="document-file"
            class="visually-hidden"
            type="file"
            multiple
            aria-describedby="selected-file-name"
          />
          <button
            id="upload-button"
            class="upload-button"
            type="submit"
            disabled
          >
            Enviar arquivo(s)
          </button>
        </form>
        <ul
          id="upload-queue"
          class="upload-queue"
          aria-label="Arquivos selecionados para envio"
          hidden
        ></ul>
        <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
        <div id="document-status" class="empty-state" role="status" aria-live="polite">
          <span>Carregando arquivos...</span>
        </div>
        <ul id="document-list" class="document-list" aria-label="Seus arquivos"></ul>
      </section>
    </main>
    <script src="../../src/modules/home.js" defer></script>
  </body>
</html>
